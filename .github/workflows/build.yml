name: Build validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, fix/real-anatomy-atlas]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type-check TypeScript
        run: npx tsc --noEmit
      - name: Verify local required models and build app
        run: npm run build
